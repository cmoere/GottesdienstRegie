<!doctype html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GottesdienstRegie – Release Notes</title>
<style>body{margin:0;background:#1f2228;color:#edf2f4;font:15px Inter,Segoe UI,sans-serif}main{max-width:940px;margin:auto;padding:42px 24px}header{border-bottom:1px solid #46505a;padding-bottom:20px}select{background:#303640;color:inherit;border:1px solid #687581;padding:8px}details{border-bottom:1px solid #46505a;padding:14px 0}summary{cursor:pointer;font-weight:700}.category{color:#79bcc5;margin-top:22px;text-transform:uppercase;font-size:12px;letter-spacing:.08em}.entry{margin:14px 0;line-height:1.6}.entry b{display:block}small{color:#aeb8c0}</style></head>
<body><main><header><h1>GottesdienstRegie</h1><p>Release Notes</p><select id="language" aria-label="Language"></select></header><div id="content"></div></main>
<script>
const languages={de:'Deutsch',en:'English',da:'Dansk',sv:'Svenska',no:'Norsk',fi:'Suomi',nl:'Nederlands',fr:'Français',es:'Español',it:'Italiano',pl:'Polski','pt-BR':'Português (Brasil)'};
const categoryNames={de:{new:'Neu',improved:'Verbessert',fixed:'Behoben',security:'Sicherheit'},en:{new:'New',improved:'Improved',fixed:'Fixed',security:'Security'},da:{new:'Nyt',improved:'Forbedret',fixed:'Rettet',security:'Sikkerhed'},sv:{new:'Nytt',improved:'Förbättrat',fixed:'Åtgärdat',security:'Säkerhet'},no:{new:'Nytt',improved:'Forbedret',fixed:'Rettet',security:'Sikkerhet'},fi:{new:'Uutta',improved:'Parannettu',fixed:'Korjattu',security:'Turvallisuus'},nl:{new:'Nieuw',improved:'Verbeterd',fixed:'Opgelost',security:'Beveiliging'},fr:{new:'Nouveau',improved:'Amélioré',fixed:'Corrigé',security:'Sécurité'},es:{new:'Nuevo',improved:'Mejorado',fixed:'Corregido',security:'Seguridad'},it:{new:'Novità',improved:'Migliorato',fixed:'Corretto',security:'Sicurezza'},pl:{new:'Nowości',improved:'Ulepszenia',fixed:'Poprawki',security:'Bezpieczeństwo'},'pt-BR':{new:'Novidades',improved:'Melhorias',fixed:'Correções',security:'Segurança'}};
const params=new URLSearchParams(location.search),picker=document.querySelector('#language');Object.entries(languages).forEach(([value,name])=>picker.add(new Option(name,value)));picker.value=params.get('lang')||navigator.language||'de';if(!languages[picker.value])picker.value=languages[picker.value.split('-')[0]]?picker.value.split('-')[0]:'en';picker.onchange=()=>{params.set('lang',picker.value);location.search=params};
const local=(value,language)=>value?.[language]??value?.en??value?.de??'';
fetch('../releases.json').then(response=>response.json()).then(data=>{const language=picker.value,categories=categoryNames[language]??categoryNames.en,root=document.querySelector('#content');data.versions.flatMap(version=>version.builds).forEach((build,index)=>{const details=document.createElement('details');details.open=index===0;details.innerHTML=`<summary>${build.version} · ${new Date(build.releaseDate).toLocaleDateString(language)}</summary>`;Object.entries(build.sections).forEach(([key,entries])=>{if(!entries.length)return;details.insertAdjacentHTML('beforeend',`<h2 class="category">${categories[key]||key}</h2>`);entries.forEach(entry=>details.insertAdjacentHTML('beforeend',`<p class="entry"><b>${local(entry.label,language)}:</b>${local(entry.text,language)}</p>`))});root.append(details)})});
</script></body></html>
