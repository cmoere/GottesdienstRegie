<!doctype html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GottesdienstRegie – Release Notes</title><style>body{margin:0;background:#1f2228;color:#edf2f4;font:15px Inter,Segoe UI,sans-serif}main{max-width:900px;margin:auto;padding:42px 24px}header{border-bottom:1px solid #46505a;padding-bottom:20px}select{background:#303640;color:inherit;border:1px solid #687581;padding:8px}details{border-bottom:1px solid #46505a;padding:14px 0}summary{cursor:pointer;font-weight:700}.category{color:#79bcc5;margin-top:22px;text-transform:uppercase;font-size:12px;letter-spacing:.08em}.entry{margin:12px 0;line-height:1.55}.entry b{display:block}small{color:#aeb8c0}</style></head><body><main><header><h1>GottesdienstRegie</h1><p>Release Notes</p><select id="language"></select></header><div id="content"></div></main><script>const languages={de:'Deutsch',en:'English',da:'Dansk',nl:'Nederlands',no:'Norsk',es:'Español',pl:'Polski','pt-BR':'Português (Brasil)'};const params=new URLSearchParams(location.search),picker=document.querySelector('#language');Object.entries(languages).forEach(([v,n])=>picker.add(new Option(n,v)));picker.value=params.get('lang')||navigator.language||'de';if(!languages[picker.value])picker.value=picker.value.split('-')[0]in languages?picker.value.split('-')[0]:'en';picker.onchange=()=>{params.set('lang',picker.value);location.search=params};const local=(v,l)=>v?.[l]??v?.en??v?.de??'';fetch('../releases.json').then(r=>r.json()).then(data=>{const lang=picker.value,categories={new:'Neu',improved:'Verbessert',fixed:'Behoben',security:'Sicherheit'},root=document.querySelector('#content');data.versions.flatMap(v=>v.builds).forEach((build,index)=>{const details=document.createElement('details');details.open=index===0;details.innerHTML=`<summary>${build.version} · ${new Date(build.releaseDate).toLocaleDateString(lang)}</summary>`;Object.entries(build.sections).forEach(([key,entries])=>{if(!entries.length)return;details.insertAdjacentHTML('beforeend',`<h2 class="category">${categories[key]||key}</h2>`);entries.forEach(entry=>details.insertAdjacentHTML('beforeend',`<p class="entry"><b>${local(entry.label,lang)}:</b>${local(entry.text,lang)}</p>`))});root.append(details)})})</script></body></html>
