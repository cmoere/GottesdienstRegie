 Livebetrieb","paragraphs":["Die jeweils bedienende Person prüft vor ON AIR eigenverantwortlich die verknüpfte Veranstaltung, den vollständigen Ablauf, sichtbare Inhalte, Übergänge, Timer, Medien, Audioquellen sowie die Zuordnung von MAIN, STAGE, Livestream und Recording. Vorschau, Preflight und Testbetrieb sind technische Hilfen, können aber falsche Inhalte, fehlerhafte Rechtezuordnungen oder externe Störungen nicht vollständig erkennen und ersetzen keine menschliche Endkontrolle. Für kritische Veranstaltungen soll eine eingewiesene zweite Person erreichbar sein und ein praktikabler Ersatzablauf ohne Cloud- oder Netzverbindung vorbereitet werden."]},{"title":"6. Inhalte und Medienrechte","paragraphs":["Es dürfen ausschließlich Texte, Bilder, Videos, Musik, Schriften, Bibelübersetzungen und sonstige Medien eingestellt oder öffentlich wiedergegeben werden, für die alle im konkreten Nutzungsumfang erforderlichen Rechte, Lizenzen oder Einwilligungen bestehen. Dies umfasst insbesondere Urheber-, Persönlichkeits-, Marken-, Datenschutz-, Aufführungs-, Streaming- und Vervielfältigungsrechte; eine technische Importmöglichkeit ist keine Bestätigung der rechtlichen Zulässigkeit. Die verantwortliche Organisation dokumentiert erforderliche Nachweise und entfernt Inhalte unverzüglich, wenn Rechte fehlen, ablaufen oder von Berechtigten nachvollziehbar beanstandet werden."]},{"title":"7. Unzulässige Nutzung","paragraphs":["Untersagt ist jede Verwendung für rechtswidrige, diskriminierende, menschenverachtende, täuschende, schädigende oder sicherheitsgefährdende Inhalte sowie für Handlungen, die Rechte anderer Personen oder Organisationen verletzen. Ebenso unzulässig sind das Umgehen technischer Schutzmaßnahmen, automatisierte Überlastungsversuche, Manipulation fremder Veranstaltungen und der Versuch, nicht freigegebene Daten oder Systeme auszulesen. Erkennbare Fehlfunktionen dürfen nicht ausgenutzt werden; sie sind so zu melden, dass keine zusätzlichen Schäden oder unnötigen Veröff lte außerhalb des bezeichneten Cachebereichs nicht entfernen."]},{"title":"11. Übersetzung und Sprachmodelle","paragraphs":["Automatisch erzeugte Übersetzungen können sprachlich, sachlich, kulturell oder theologisch unzutreffend sein und dürfen nicht ohne inhaltliche Prüfung als verbindliche Übersetzung behandelt werden. Die verantwortliche Person kontrolliert insbesondere Eigennamen, Bibelstellen, Liedtexte, Fachbegriffe und Aussagen, deren falsche Wiedergabe Personen verletzen oder den Sinn wesentlich verändern könnte. Herunterladbare Sprachmodelle benötigen lokalen Speicherplatz und beim ersten Bezug eine Internetverbindung; bei der Weitergabe einer Präsentation muss das benötigte Modell gegebenenfalls auch auf dem Zielgerät installiert werden."]},{"title":"12. Updates und Änderungen","paragraphs":["Aktualisierungen können Funktionen ergänzen, verändern oder entfernen sowie Dateiformate, Systemvoraussetzungen, Sicherheitsmechanismen und diese Nutzungsbedingungen anpassen. Vor einem Update sind laufende Ausgaben zu beenden, wichtige Präsentationen zu sichern und ausreichend Zeit für Installation und anschließende Kontrolle einzuplanen; Updates sollen nicht unmittelbar vor einer Veranstaltung ungeprüft eingespielt werden. Wesentliche Änderungen werden mit Versionsnummer und Datum kenntlich gemacht, wobei ältere Versionen aus Sicherheits- oder Kompatibilitätsgründen nicht dauerhaft unterstützt werden müssen."]},{"title":"13. Verfügbarkeit und Datensicherung","paragraphs":["Eine ununterbrochene, fehlerfreie oder für jeden Einsatzzweck geeignete Verfügbarkeit der Anwendung und verbundener Dienste wird nicht zugesagt. Wartung, Updates, Netzwerkausfälle, Änderungen externer Schnittstellen oder Fehler an Computern und Ausgabegeräten können Funktionen zeitweise einschränken. Nutzer erstellen deshalb in angemessenen Abständen überprüfbare Sicherungskopien und halten für den Ausfall von Netzwerk, Cloud, Medienserver, Audio, Computer oder Ausgabegerät einen organisatorisch e
