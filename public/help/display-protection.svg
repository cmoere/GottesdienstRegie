<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Bildschirm aktiv halten"><rect width="960" height="420" fill="#152d38"/><g font-family="Arial,sans-serif" fill="#f5fafb"><text x="36" y="56" font-size="28" font-weight="700">Bildschirm aktiv halten</text><rect x="36" y="92" width="284" height="64" rx="8" fill="#285461"/><text x="52" y="130" font-size="16">1. Standard: eingeschaltet</text><rect x="338" y="92" width="284" height="64" rx="8" fill="#285461"/><text x="354" y="130" font-size="16">2. Jederzeit abschaltbar</text><rect x="640" y="92" width="284" height="64" rx="8" fill="#285461"/><text x="656" y="130" font-size="16">3. Beim Beenden freigeben</text><rect x="36" y="184" width="428" height="138" rx="8" fill="#edf4f5"/><rect x="488" y="184" width="428" height="138" rx="8" fill="#edf4f5"/><g fill="#173746"><text x="56" y="221" font-size="15" font-weight="700">GottesdienstRegie geöffnet</text><text x="56" y="270" font-size="21">Display-Schutz ist aktiv</text><text x="508" y="221" font-size="15" font-weight="700">GottesdienstRegie beendet</text><text x="508" y="270" font-size="21">Normale Energieeinstellungen</text></g><text x="36" y="375" font-size="17" fill="#a6d4dd">Manuelles Sperren und Sicherheitsrichtlinien bleiben wirksam</text></g></svg>
