name: Cross-platform release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['package.json']
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Release-Version prüfen
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then exit 1; fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then exit 1; fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Versions-Funktionstests
        run: node scripts/generate-terms.cjs && node scripts/check-version39.cjs && node scripts/check-version40.cjs && node scripts/check-version41.cjs && node scripts/check-version42.cjs && node scripts/check-version43.cjs && node scripts/check-version431.cjs && node scripts/check-version44.cjs && node scripts/check-version45.cjs && node scripts/check-version451.cjs && node scripts/check-version46.cjs && node scripts/check-version47.cjs && node scripts/check-version48.cjs && node scripts/check-version49.cjs && node scripts/check-version50.cjs
      - name: Anwendung bauen
        run: npm run build
      - name: Windows-Installer erstellen
        run: npx electron-builder --win nsis --publish never
      - name: Release samt Update-Dateien veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            release/GottesdienstRegie-Setup-*.exe
            release/GottesdienstRegie-Setup-*.exe.blockmap
            release/latest.yml
  macos:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --mac dmg zip --x64 --arm64 --publish never
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          files: |
            release/GottesdienstRegie-*.dmg
            release/GottesdienstRegie-*.zip
            release/latest-mac.yml
  linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --linux AppImage deb --x64 --publish never
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          files: |
            release/GottesdienstRegie-*.AppImage
            release/GottesdienstRegie-*.deb
            release/latest-linux.yml
