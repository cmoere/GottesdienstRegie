name: Cross-platform release

on:
  workflow_dispatch:
    inputs:
      windows_only:
        description: 'Nur fehlende Windows-Dateien eines bestehenden Releases ergänzen'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['package.json']

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Release-Version prüfen
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then exit 1; fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then exit 1; fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
  verify:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Vollständige Tests vor Veröffentlichung
        run: npm run test:unit -- --maxWorkers=2
  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Versions-Funktionstests
        run: node scripts/generate-terms.cjs && node scripts/check-version39.cjs && node scripts/check-version40.cjs && node scripts/check-version41.cjs && node scripts/check-version42.cjs && node scripts/check-version43.cjs && node scripts/check-version431.cjs && node scripts/check-version44.cjs && node scripts/check-version45.cjs && node scripts/check-version451.cjs && node scripts/check-version46.cjs && node scripts/check-version47.cjs && node scripts/check-version48.cjs && node scripts/check-version49.cjs && node scripts/check-version50.cjs && node scripts/check-version51.cjs && node scripts/check-version52.cjs && node scripts/check-version521.cjs && node scripts/check-version53.cjs && node scripts/check-version54.cjs && node scripts/check-version55.cjs && node scripts/check-version56.cjs && node scripts/check-version57.cjs && node scripts/check-version58.cjs && node scripts/check-version59.cjs && node scripts/check-version60.cjs && node scripts/check-version61.cjs && node scripts/check-version62.cjs && node scripts/check-version63.cjs && node scripts/check-version64.cjs && node scripts/check-version65.cjs && node scripts/check-version66.cjs && node scripts/check-version67.cjs && node scripts/check-version68.cjs
      - name: V69-Freigabe prüfen
        run: node scripts/check-version69.cjs
      - name: V70-Freigabe prüfen
        run: node scripts/check-version70.cjs
      - name: V71-Freigabe prüfen
        run: node scripts/check-version71.cjs
      - name: V71.1-Freigabe prüfen
        run: node scripts/check-version711.cjs
      - name: V72-Freigabe prüfen
        run: node scripts/check-version72.cjs
      - name: V72.1-Freigabe prüfen
        run: node scripts/check-version721.cjs
      - name: V73-Freigabe prüfen
        run: node scripts/check-version73.cjs
      - name: V74-Freigabe prüfen
        run: node scripts/check-version74.cjs
      - name: Anwendung bauen
        # V75 guard also protects the published update feed metadata.
        run: node scripts/check-version75.cjs && node scripts/check-version83.cjs && node scripts/check-version84.cjs && node scripts/check-version85.cjs && node scripts/check-version86.cjs && npm run build
      - name: Windows-Installer erstellen
        run: node scripts/package-ci.cjs --win nsis --publish never
      - name: Windows-Dateien für gemeinsame Veröffentlichung sichern
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          retention-days: 3
          path: |
            release/GottesdienstRegie-Setup-*.exe
            release/GottesdienstRegie-Setup-*.exe.blockmap
            release/latest.yml
  macos:
    needs: prepare
    if: ${{ github.event.inputs.windows_only != 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm run build
      - run: node scripts/package-ci.cjs --mac dmg zip --x64 --arm64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          if-no-files-found: error
          retention-days: 3
          path: |
            release/GottesdienstRegie-*.dmg
            release/GottesdienstRegie-*.zip
            release/latest-mac.yml
  linux:
    needs: prepare
    if: ${{ github.event.inputs.windows_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm run build
      - run: node scripts/package-ci.cjs --linux AppImage deb --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          if-no-files-found: error
          retention-days: 3
          path: |
            release/GottesdienstRegie-*.AppImage
            release/GottesdienstRegie-*.deb
            release/latest-linux.yml
  publish:
    needs: [prepare, verify, windows, macos, linux]
    if: ${{ always() && needs.verify.result == 'success' && needs.windows.result == 'success' && (needs.macos.result == 'success' || needs.macos.result == 'skipped') && (needs.linux.result == 'success' || needs.linux.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Vollständiges normales Update freigeben
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          node scripts/current-release-notes.cjs "${RELEASE_TAG#v}" > current-release-notes.md
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$RELEASE_SHA" --draft --title "$RELEASE_TAG" --notes-file current-release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release view "$RELEASE_TAG" --json assets > release-assets.json
          node scripts/check-release-assets.cjs release-assets.json "${RELEASE_TAG#v}"
          gh release edit "$RELEASE_TAG" --draft=false --latest
