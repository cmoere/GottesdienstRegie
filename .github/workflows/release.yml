name: Cross-platform release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Anwendung bauen
        run: npm run build
      - name: Windows-Installer erstellen
        run: npx electron-builder --win nsis --publish never
      - name: Release samt Update-Dateien veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            release/GottesdienstRegie-Setup-*.exe
            release/GottesdienstRegie-Setup-*.exe.blockmap
            release/latest.yml
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --mac dmg zip --x64 --arm64 --publish never
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            release/GottesdienstRegie-*.dmg
            release/GottesdienstRegie-*.zip
            release/latest-mac.yml
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --linux AppImage deb --x64 --publish never
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            release/GottesdienstRegie-*.AppImage
            release/GottesdienstRegie-*.deb
            release/latest-linux.yml
