name: Windows-Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Anwendung bauen
        run: npm run build
      - name: Windows-Installer erstellen
        run: npx electron-builder --win nsis --publish never
      - name: Release samt Update-Dateien veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            release/GottesdienstRegie-Setup-*.exe
            release/GottesdienstRegie-Setup-*.exe.blockmap
            release/latest.yml
