name: Release-Notes-Webseite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Nutzungsbedingungen prüfen
        run: node scripts/generate-terms.cjs && node scripts/check-version43.cjs && git diff --exit-code -- build/terms.txt public/terms/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Release-Notes-Webseite veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
